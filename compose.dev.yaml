# Local infrastructure only: Postgres and Redis on non-default host ports.
# Run api and web directly on the host during development.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: watchdeck
      POSTGRES_PASSWORD: watchdeck
      POSTGRES_DB: watchdeck
    ports:
      - "5433:5432"
    volumes:
      - watchpile-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdeck -d watchdeck"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  watchpile-dev-db:
