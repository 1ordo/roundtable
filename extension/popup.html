<!doctype html>
<meta charset="utf-8" />
<title>Roundtable</title>
<link rel="stylesheet" href="ui.css" />
<main class="popup">
  <header>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden>
      <circle cx="11" cy="13" r="7" fill="none" stroke="#ec6a3f" stroke-width="2.2"/>
      <circle cx="13" cy="11" r="7" fill="none" stroke="#4cbaa4" stroke-width="2.2" opacity="0.9"/>
    </svg>
    <h1>Roundtable</h1>

  <a id="settings" href="#">Settings</a>

<script type="module" src="popup.js"></script>
