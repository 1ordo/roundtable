server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream per request, through a
    # variable, means a rebuilt api container gets picked up immediately.
    # With a literal proxy_pass nginx caches the old container IP at start
    # and every request 502s until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:8000";

    # Security headers, on every response including errors, which is what
    # "always" buys. The document holds the session, so without
    # frame-ancestors any page can frame the admin panel and its destructive
    # actions. Without a CSP, one XSS anywhere is account takeover with
    # nothing in the way.
    #
    # img-src has to allow TMDB, which is where every poster comes from, and
    # data: for the share cards the browser draws. style-src needs
    # 'unsafe-inline' because the app sets inline custom properties for the
    # theme. script-src does not, and must not.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org; font-src 'self' data:; connect-src 'self'; media-src 'self' https://image.tmdb.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Harmless over plain HTTP: browsers ignore it on an insecure origin, so
    # a LAN instance is unaffected and one behind HTTPS is pinned.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Traefik terminates TLS in front of this; keep its forwarded headers.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 64m;
        # The AI endpoints think for a while; do not cut them off.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        # An add_header anywhere in a location block discards every header
        # inherited from the server block, so nosniff has to be restated
        # here or the scripts are served without it.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
