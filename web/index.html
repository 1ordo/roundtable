<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181114" />
    <title>Roundtable, free self-hosted film and series discovery</title>
    <meta
      name="description"
      content="Free and self-hosted. Roundtable learns your taste from what you actually do, tells you which of your services has it in your country, and warns you the morning a film opens in your cinemas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roundtable, free self-hosted film and series discovery" />
    <meta
      property="og:description"
      content="Stop scrolling. Start watching. Free, on your own machine."
    />
    <meta property="og:image" content="/shots/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      const stored = localStorage.getItem('wd-theme')
      if (
        stored === 'light' ||
        (stored === 'system' &&
          window.matchMedia('(prefers-color-scheme: light)').matches)
      ) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
