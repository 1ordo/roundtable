# Publishes container images so self-hosters pull instead of compile.
#
# Building from source on the user's machine means an npm install, a Vite
# build and a pip resolve before anything is testable, on hardware nobody
# tested. That is minutes on a laptop and considerably worse on the arm64
# NAS and Raspberry Pi hardware a lot of this audience actually runs, which
# is why both platforms are built here.
name: release

on:
  push:
    tags: ['v*']
  # Useful for testing the workflow itself without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./api
          - name: web
            context: ./web
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated here, which is slow but correct. The alternative
      # is a native arm runner; worth revisiting if this job starts timing out.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
        working-directory: extension
      - run: node build.js
        working-directory: extension
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: extension/dist/*.zip
          generate_release_notes: true
